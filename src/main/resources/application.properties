# Application Name
spring.application.name=whatsapp-crm

# Server Configuration
server.port=${SERVER_PORT:8080}

# Jackson Configuration
spring.jackson.time-zone=UTC
spring.codec.max-in-memory-size=10MB
# Actuator Configuration
management.endpoints.web.exposure.include=health,info

# WhatsApp Provider Configuration
whatsapp.providers.meta.apiBaseUrl=${WHATSAPP_PROVIDERS_META_API_BASE_URL:https://graph.facebook.com/v22.0}
whatsapp.providers.meta.phoneNumberId=${WHATSAPP_PROVIDERS_META_PHONE_NUMBER_ID:}
whatsapp.providers.meta.accessToken=${WHATSAPP_PROVIDERS_META_ACCESS_TOKEN:}
whatsapp.throttle.messagesPerSecond=${WHATSAPP_THROTTLE_MESSAGES_PER_SECOND:5}
whatsapp.webhook.verify-token=${WHATSAPP_WEBHOOK_VERIFY_TOKEN:}
whatsapp.webhook.auth-token=${WHATSAPP_WEBHOOK_AUTH_TOKEN:}

# Security JWT Configuration
security.jwt.secret=${SECURITY_JWT_SECRET:THIS_IS_A_MUCH_LONGER_SUPER_SECRET_KEY_FOR_JWT_THAT_SHOULD_BE_AT_LEAST_256_BITS_LONG_SO_IT_WORKS_CORRECTLY_WITH_HMAC_SHA256}
security.jwt.expirationSeconds=${SECURITY_JWT_EXPIRATION_SECONDS:3600}

# Active Profile (default can be overridden by SPRING_PROFILES_ACTIVE)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}

# Database Configuration (provided via env on Railway)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-green-darkness-a1y31vkp-pooler.ap-southeast-1.aws.neon.tech/VartaAi?sslmode=require&channel_binding=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:npg_gV1kO5zUimSt}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.datasource.database=${SPRING_DATASOURCE_DATABASE:VartaAI}
